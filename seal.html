اني (للإعلان والريلز والفيديو)<\/label><select id=\"g_d\"><option>15<\/option><option>30<\/option><option>45<\/option><option>60<\/option><\/select>\n<button class=\"cp\" style=\"margin-top:18px;padding:15px\" id=\"g_b\">⚡ ابنِ لي البرومبت<\/button>\n<div id=\"g_o\" hidden><div class=\"out\" id=\"g_txt\"><\/div><p class=\"tip\" id=\"g_tip\"><\/p><button class=\"cp\" id=\"g_c\">انسخ البرومبت<\/button><\/div>\n<\/section>\n<section id=\"fav\" hidden><div id=\"fl\"><\/div><\/section>\n<\/div>\n<nav><button id=\"n_l\" class=\"on\"><span>📚<\/span>المكتبة<\/button><button id=\"n_c\"><span>🚀<\/span>حملتي<\/button><button id=\"n_g\"><span>⚡<\/span>المولّد<\/button><button id=\"n_f\"><span>⭐<\/span>المفضلة<\/button><\/nav>\n<div id=\"toast\">تم النسخ ✓<\/div>\n<script>\nconst PROMPTS=[{\"c\": \"إعلانات\", \"t\": \"لقطة منتج سينمائية\", \"p\": \"لقطة سينمائية قريبة لـ [المنتج] على سطح [نوع السطح]، إضاءة ناعمة من الجانب، حركة كاميرا بطيئة نحو المنتج، خلفية ضبابية، ألوان [لون العلامة]، جودة 4K.\"}, {\"c\": \"إعلانات\", \"t\": \"سكربت إعلان 15 ثانية\", \"p\": \"اكتب سكربت إعلان 15 ثانية لـ [المنتج] موجه لـ [الجمهور]: الثواني 0-3 جملة تُوقف التمرير، 3-10 الفائدة الرئيسية، 10-15 دعوة للشراء. أضف وصف المشهد لكل جزء.\"}, {\"c\": \"إعلانات\", \"t\": \"قبل وبعد\", \"p\": \"اكتب فكرة إعلان «قبل وبعد» لـ [المنتج]: مشهد المشكلة [المشكلة] بإضاءة باهتة، ثم لحظة التحول، ثم النتيجة بإضاءة دافئة. حدد لكل لقطة المدة وزاوية الكاميرا.\"}, {\"c\": \"إعلانات\", \"t\": \"عرض محدود\", \"p\": \"اكتب 5 نصوص إعلان قصيرة لعرض [نسبة الخصم] على [المنتج] ينتهي خلال [المدة]، بنبرة [حماسية/هادئة]، وكل نص ينتهي بدعوة واضحة للتواصل عبر واتساب.\"}, {\"c\": \"إعلانات\", \"t\": \"نص إعلان فيسبوك\", \"p\": \"اكتب إعلان فيسبوك لـ [المنتج] لجمهور [العمر والاهتمام]: عنوان من 6 كلمات، ثم 3 جمل تذكر المشكلة والحل، ثم دعوة للشراء. أعطني 3 نسخ مختلفة للاختبار.\"}, {\"c\": \"إعلانات\", \"t\": \"شهادة عميل مصوّرة\", \"p\": \"اكتب سكربت فيديو شهادة عميل قصيرة عن [المنتج] بأسلوب عفوي كأنه مصوّر بالهاتف، يذكر المشكلة قبل الشراء والنتيجة بعده، مع 3 لقطات مقترحة للمونتاج.\"}, {\"c\": \"ريلز\", \"t\": \"10 جمل افتتاحية قوية\", \"p\": \"اقترح 10 جمل افتتاحية لأول 3 ثوانٍ من ريلز عن [الموضوع]، كل جملة تثير فضولًا أو تحديًا أو مفاجأة، بدون أي مقدمة أو ترحيب.\"}, {\"c\": \"ريلز\", \"t\": \"ريلز تعليمي 30 ثانية\", \"p\": \"اكتب سكربت ريلز مدته 30 ثانية يشرح [الفكرة] في 3 نقاط بسيطة لمبتدئ. لكل نقطة: الجملة المنطوقة والنص الظاهر على الشاشة واللقطة المقترحة.\"}, {\"c\": \"ريلز\", \"t\": \"قصة نجاح قصيرة\", \"p\": \"حوّل هذه التجربة إلى ريلز 25 ثانية بأسلوب قصصي: [التجربة]. ابدأ بالنتيجة المفاجئة، ثم ارجع للبداية، ثم اختم بنصيحة واحدة قابلة للتطبيق.\"}, {\"c\": \"ريلز\", \"t\": \"خطة محتوى 30 يومًا\", \"p\": \"ضع لي جدول محتوى 30 يومًا لحساب [المجال] على إنستغرام وتيك توك، يوم بيوم: فكرة الريلز، نوعها (تعليمي/قصة/ترفيهي)، وجملة الافتتاح.\"}, {\"c\": \"ريلز\", \"t\": \"وصف وهاشتاقات\", \"p\": \"اكتب وصفًا جذابًا لريلز عن [الموضوع] لا يتجاوز 3 أسطر، مع سؤال يحفّز التعليق، و10 هاشتاقات مناسبة بين الشائعة والمتخصصة.\"}, {\"c\": \"ريلز\", \"t\": \"تحويل مقال إلى ريلز\", \"p\": \"لخّص النص التالي إلى سكربت ريلز مدته 40 ثانية بأسلوب محادثة: [النص]. اجعل الجمل قصيرة، وأضف نقاط التوقف المناسبة للمونتاج.\"}, {\"c\": \"صور\", \"t\": \"صورة منتج احترافية\", \"p\": \"صورة منتج احترافية لـ [المنتج] على خلفية استوديو بلون [اللون]، إضاءة ناعمة، ظل خفيف تحت المنتج، تفاصيل حادة، أسلوب مجلات الإعلانات، نسبة 4:5.\"}, {\"c\": \"صور\", \"t\": \"صورة غلاف / ثمبنيل\", \"p\": \"تصميم غلاف جذاب لفيديو عن [الموضوع]: عنوان كبير من 3 كلمات «[العنوان]»، وجه شخص بتعبير [الدهشة/الحماس]، تباين عالٍ بين الألوان [لونان]، مساحة فارغة على اليسار.\"}, {\"c\": \"صور\", \"t\": \"شعار بسيط\", \"p\": \"شعار بسيط وحديث لعلامة [الاسم] في مجال [المجال]، رمز هندسي نظيف مع الاسم بخط واضح، لونان فقط [اللونان]، خلفية بيضاء، بدون تفاصيل معقدة.\"}, {\"c\": \"صور\", \"t\": \"شخصية ثابتة للمحتوى\", \"p\": \"شخصية كرتونية ثلاثية الأبعاد لـ [وصف الشخصية]، ملامح ثابتة وملابس [الملابس]، تظهر بوضعيات مختلفة: تقف، تشير بيدها، تضحك. خلفية موحدة لسهولة إعادة الاستخدام.\"}, {\"c\": \"صور\", \"t\": \"صورة نمط حياة\", \"p\": \"صورة واقعية لشخص [الوصف] يستخدم [المنتج] في [المكان]، ضوء طبيعي دافئ، تعبير مرتاح غير متصنع، عمق ميدان خفيف، كأنها صورة من حملة إعلانية.\"}, {\"c\": \"صور\", \"t\": \"تحسين وصف الصورة\", \"p\": \"أعد كتابة هذا الوصف ليصبح برومبت صور أدق: [وصفك]. أضف نوع اللقطة والإضاءة والألوان والخلفية والجودة، وأعطني نسختين: واقعية وفنية.\"}, {\"c\": \"فيديو\", \"t\": \"تحريك صورة ثابتة\", \"p\": \"حرّك هذه الصورة بحركة كاميرا بطيئة تقترب من [العنصر]، مع حركة خفيفة في [الشعر/القماش/الدخان] وبقاء بقية المشهد ثابتًا، مدة 5 ثوانٍ.\"}, {\"c\": \"فيديو\", \"t\": \"مشهد خارجي سينمائي\", \"p\": \"مشهد سينمائي لـ [المكان] وقت [الغروب/الفجر]، كاميرا تتحرك ببطء من اليمين لليسار، غبار خفيف في الضوء، ألوان دافئة، إحساس فيلم، مدة 6 ثوانٍ.\"}, {\"c\": \"فيديو\", \"t\": \"انتقال سلس بين لقطتين\", \"p\": \"انتقال سلس بين [اللقطة الأولى] و[اللقطة الثانية] عبر حركة [دوران/تكبير/مرور من أمام الكاميرا]، بإيقاع سريع وبدون قطع حاد.\"}, {\"c\": \"فيديو\", \"t\": \"تعليق صوتي للفيديو\", \"p\": \"اكتب تعليقًا صوتيًا مدته [المدة] ثانية لفيديو عن [الموضوع] بنبرة [هادئة/حماسية]، بجمل قصيرة تُقرأ بسهولة، مع علامة (توقف) حيث يلزم.\"}, {\"c\": \"فيديو\", \"t\": \"تقسيم السكربت إلى لقطات\", \"p\": \"قسّم هذا السكربت إلى لقطات مرقمة: [السكربت]. لكل لقطة اكتب: المدة، ما يظهر على الشاشة، حركة الكاميرا، وبرومبت جاهز لتوليدها بالذكاء الاصطناعي.\"}, {\"c\": \"فيديو\", \"t\": \"فيديو منتج من 3 لقطات\", \"p\": \"صمّم فيديو من 3 لقطات لـ [المنتج]: لقطة افتتاحية واسعة، لقطة قريبة على التفاصيل، لقطة أخيرة للشعار. أعطني برومبتًا مستقلًا لكل لقطة بنفس الإضاءة والألوان.\"}, {\"c\": \"تسويق\", \"t\": \"وصف منتج يبيع\", \"p\": \"اكتب وصف منتج لـ [المنتج] في 4 أسطر: سطر يلفت الانتباه، سطران للفوائد وليس المواصفات، وسطر أخير يدعو لطلبه الآن. الجمهور: [الجمهور].\"}, {\"c\": \"تسويق\", \"t\": \"رسالة واتساب لعميل مهتم\", \"p\": \"اكتب رسالة واتساب قصيرة ودودة لعميل سأل عن [المنتج] ولم يشترِ بعد. اذكر فائدة واحدة وسعر [السعر] وسهّل الخطوة التالية. لا تتجاوز 4 أسطر.\"}, {\"c\": \"تسويق\", \"t\": \"رد على اعتراض «غالي»\", \"p\": \"اكتب 3 ردود مختلفة على عميل قال إن [المنتج] غالي: رد يشرح القيمة، ورد يقارن بتكلفة عدم الشراء، ورد يقدم خيار دفع أو عرضًا بنبرة غير ملحّة.\"}, {\"c\": \"تسويق\", \"t\": \"10 عناوين تجذب النقر\", \"p\": \"اكتب 10 عناوين لمنشور أو إعلان عن [المنتج] لجمهور [الجمهور]، بينها 3 بصيغة سؤال و3 بأرقام و2 بوعد واضح و2 تثير الفضول.\"}, {\"c\": \"تسويق\", \"t\": \"بوست إنستغرام متكامل\", \"p\": \"اكتب بوست إنستغرام عن [الموضوع]: سطر افتتاحي قوي، 3 فقرات قصيرة، دعوة للتفاعل، و8 هاشتاقات. بنبرة [النبرة] وبدون مبالغة.\"}, {\"c\": \"تسويق\", \"t\": \"ستوري من 5 شرائح\", \"p\": \"صمّم ستوري إنستغرام من 5 شرائح لعرض [المنتج]: شريحة تشويق، مشكلة، حل، دليل أو تجربة، ثم دعوة للتواصل. اكتب نص كل شريحة وفكرة التصميم.\"}];\nconst ICON={\"إعلانات\":\"📣\",\"ريلز\":\"🎬\",\"صور\":\"🖼️\",\"فيديو\":\"🎥\",\"تسويق\":\"💬\"};\nconst $=id=>document.getElementById(id);\nlet cat=\"الكل\",term=\"\",fav=[];\ntry{fav=JSON.parse(localStorage.getItem(\"avp-fav\")||\"[]\")}catch(e){}\nconst saveFav=()=>{try{localStorage.setItem(\"avp-fav\",JSON.stringify(fav))}catch(e){}};\n$(\"n1\").textContent=PROMPTS.length;\nfunction toast(){const t=$(\"toast\");t.classList.add(\"s\");setTimeout(()=>t.classList.remove(\"s\"),1600)}\nfunction copy(t){const d=()=>toast();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(d).catch(()=>{const a=document.createElement(\"textarea\");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand(\"copy\");d()}catch(e){}a.remove()})}\nconst esc=s=>s.replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\");\nconst hl=s=>esc(s).replace(/\\[([^\\]]+)\\]/g,\"<mark>[$1]<\/mark>\");\nfunction card(x){const f=fav.includes(x.i);return `<div class=\"pc\"><div class=\"pt\"><span class=\"tag\">${ICON[x.c]||\"\"} ${x.c}<\/span><button class=\"star ${f?\"on\":\"\"}\" data-s=\"${x.i}\" aria-label=\"مفضلة\">${f?\"★\":\"☆\"}<\/button><\/div><h3>${x.t}<\/h3><p>${hl(x.p)}<\/p><button class=\"cp\" data-i
